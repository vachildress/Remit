[project]
name = "remit"
version = "0.0.1"
description = "Evidence-gated authority for AI agents: per-capability grants derived from typed assurance evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
remit = "remit.cli:main"
demo = "remit.demo:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
