[project]
name = "ceoai"
version = "0.0.1"
description = "Evidence-gated authority for AI agents: per-capability grants derived from typed assurance evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evidence = "ceoai.cli:main"
demo = "ceoai.demo:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceoai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
