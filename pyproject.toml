[project]
name = "remit"
version = "0.0.1"
description = "Evidence-gated authority for AI agents: per-capability grants derived from typed assurance evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# The Microsoft Agent Governance Toolkit policy kernel, the enforcement point.
# Optional so that the evidence and policy layers stay standard library plus
# PyYAML; without it remit falls back to the stub enforcement point.
agt = ["agent-os-kernel>=3.7,<4"]

[project.scripts]
remit = "remit.cli:main"
demo = "remit.demo:main"

[dependency-groups]
dev = ["pytest>=8", "agent-os-kernel>=3.7,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside the AGT kernel's own pydantic models, not by remit.
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
